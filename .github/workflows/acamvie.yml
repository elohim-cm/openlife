name: Docker Production Deployment

on:
  push:
    branches: [ openlife ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v2
    - name: Deploy to production
      uses: appleboy/ssh-action@master
      with:
        username: ${{ secrets.ACAMVIE_USER_NAME_PROD }}
        password: ${{ secrets.ACAMVIE_PASSWORD_PROD }}
        host: ${{ secrets.ACAMVIE_HOST_PROD }}
        port: ${{ secrets.ACAMVIE_PORT_PROD }}
        script: 'cd /var/www/openlife.acamvie.com/web && ./server_deploy.sh'
